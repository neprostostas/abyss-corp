[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "24"
  VITE_POSTHOG_KEY = "phc_CouHmm8ZKBpAs9hJr9mtGUac7ozMymSGSPo4GD3AHtb8"
  VITE_SUPABASE_URL = "https://qduhqhhhsboljuipruvy.supabase.co"
  VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_dC4OkLBsY1K_4fIlAEYW9A_wT6LQMHT"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
