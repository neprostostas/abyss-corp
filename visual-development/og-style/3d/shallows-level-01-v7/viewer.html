<!doctype html>
<html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abyss — 3D-сцена</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
<style>body{margin:0;background:#062b3c;color:#fff;font:16px system-ui}header{padding:18px 24px}model-viewer{width:100%;height:80vh;background:radial-gradient(ellipse,#136276,#052735)}button,a{color:inherit;background:#15566a;border:1px solid #328a9d;border-radius:8px;padding:10px;cursor:pointer}p{color:#a8d6df}#status{margin:10px 24px}model-viewer{position:relative;background:linear-gradient(#167b91,#063e60 65%,#02273e)}model-viewer::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(112deg,transparent 15%,#89f5ff19 18%,transparent 24%,transparent 38%,#b8fbff20 41%,transparent 48%,transparent 63%,#b8fbff16 66%,transparent 74%),linear-gradient(180deg,#22d5ed22,transparent 35%,#002e5930);mix-blend-mode:screen}model-viewer::before{content:"";position:absolute;z-index:2;inset:0 0 auto;height:15%;pointer-events:none;background:repeating-radial-gradient(ellipse at 50% -120%,transparent 0 35px,#9af6ff25 38px,transparent 42px);filter:blur(3px)} </style>
<header><b>Abyss Corp · робоча 3D-сцена</b><p>Перетягуй для обертання · колесо для масштабу · права кнопка для переміщення</p><button id="reset">Початковий ракурс</button> <button id="rotate">Автообертання</button> <a href="../../style-reference.png" target="_blank">Оригінал</a></header>
<model-viewer id="scene" src="../shallows-level-01-v8/scene.glb" camera-controls shadow-intensity="0.7" exposure="1.0" environment-image="neutral" camera-orbit="35deg 58deg 16m" camera-target="0m 0m 0m" min-camera-orbit="auto 5deg 4m" max-camera-orbit="auto 175deg 35m" alt="Редагована підводна сцена з буром, резервуаром, гаражем і субмариною"></model-viewer><p id="status">Завантаження моделі…</p>
<script>const scene=document.querySelector('#scene');document.querySelector('#reset').onclick=()=>{scene.cameraOrbit='35deg 58deg 16m';scene.cameraTarget='0m 0m 0m'};document.querySelector('#rotate').onclick=()=>{scene.autoRotate=!scene.autoRotate};scene.addEventListener('load',()=>document.querySelector('#status').textContent='Сцену завантажено. Світло включено в модель. Підводні промені — екранний ефект; об’єм води ще потребує окремого шейдера.');scene.addEventListener('error',()=>document.querySelector('#status').textContent='Не вдалося завантажити сцену. Відкрий сторінку через локальний HTTP-сервер.');</script></html>
